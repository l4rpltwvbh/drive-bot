<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
<title>FTM Drive Browser</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0d0d14;
  --bg2:         #11111c;
  --surface:     #181826;
  --surface2:    #1e1e30;
  --glass:       rgba(255,255,255,0.04);
  --glass-border:rgba(255,255,255,0.08);
  --text:        #eeeef5;
  --text2:       #8888a8;
  --text3:       #404058;
  --purple:      #8b5cf6;
  --purple2:     #6d3dcc;
  --purple-glow: rgba(139,92,246,0.25);
  --blue:        #3b82f6;
  --green:       #22d3a5;
  --green2:      #16b88e;
  --green-glow:  rgba(34,211,165,0.2);
  --red:         #f87171;
  --orange:      #fb923c;
  --pink:        #f472b6;
  --border:      rgba(255,255,255,0.06);
  --border2:     rgba(255,255,255,0.11);
  --hover:       rgba(255,255,255,0.04);
  --selected:    rgba(34,211,165,0.09);
  --sel-border:  rgba(34,211,165,0.35);
  --sidebar-w:   224px;
  --header-h:    58px;
  --r:           14px;
  --r-sm:        9px;
}

body {
  font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 60% 40% at 70% -10%, rgba(139,92,246,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at -10% 80%, rgba(34,211,165,0.08) 0%, transparent 50%);
}

/* ─── Header ─── */
.header {
  height: var(--header-h);
  background: linear-gradient(180deg, rgba(30,20,50,0.95) 0%, rgba(24,24,38,0.95) 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  z-index: 20;
  position: relative;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--purple), var(--green), transparent);
  opacity: 0.45;
}

.sidebar-toggle {
  display: none;
  width: 34px; height: 34px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  color: var(--text2);
  font-size: 1rem;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.sidebar-toggle:hover { background: var(--hover); color: var(--text); }

.logo-wrap {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}
.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem;
  box-shadow: 0 0 12px var(--purple-glow), 0 2px 6px rgba(0,0,0,0.4);
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { box-shadow: 0 0 10px var(--purple-glow), 0 2px 6px rgba(0,0,0,0.4); }
  50%       { box-shadow: 0 0 20px rgba(139,92,246,0.4), 0 2px 6px rgba(0,0,0,0.4); }
}
.logo-name {
  font-size: 0.94rem;
  font-weight: 800;
  background: linear-gradient(90deg, #c4b5fd, #7dd3fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.03em;
}
.logo-sub { font-size: 0.68rem; color: var(--text2); font-weight: 400; margin-top: 1px; }

.header-sep { width: 1px; height: 22px; background: var(--border2); flex-shrink: 0; }

.header-info { flex: 1; min-width: 0; }
.header-folder {
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.header-meta { font-size: 0.69rem; color: var(--text2); margin-top: 2px; }

.sel-pill {
  display: none;
  align-items: center;
  gap: 5px;
  background: linear-gradient(135deg, rgba(34,211,165,0.15), rgba(34,211,165,0.08));
  border: 1px solid var(--sel-border);
  border-radius: 20px;
  padding: 4px 11px;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--green);
  white-space: nowrap;
  flex-shrink: 0;
  animation: pillIn 0.2s ease;
}
.sel-pill.show { display: flex; }
@keyframes pillIn { from { opacity:0; transform: scale(0.8); } to { opacity:1; transform: scale(1); } }

/* ─── Body ─── */
.body { display: flex; flex: 1; overflow: hidden; }

/* ─── Sidebar ─── */
.sidebar {
  width: var(--sidebar-w);
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg2) 100%);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
  transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
.sidebar-hdr {
  padding: 11px 13px 9px;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sidebar-tree { overflow-y: auto; flex: 1; padding: 6px 5px; }

.tree-node { user-select: none; }
.tree-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 9px;
  cursor: pointer;
  border-radius: var(--r-sm);
  margin-bottom: 1px;
  font-size: 0.79rem;
  color: var(--text2);
  transition: background 0.12s, color 0.12s;
  position: relative;
}
.tree-row:hover { background: var(--hover); color: var(--text); }
.tree-row.active {
  background: linear-gradient(90deg, rgba(139,92,246,0.15) 0%, rgba(139,92,246,0.05) 100%);
  color: #c4b5fd;
}
.tree-row.active::before {
  content: '';
  position: absolute;
  left: 0; top: 5px; bottom: 5px;
  width: 2.5px;
  background: linear-gradient(180deg, var(--purple), var(--blue));
  border-radius: 3px;
  box-shadow: 0 0 6px var(--purple-glow);
}
.tree-row .arrow { font-size: 0.45rem; color: var(--text3); width: 10px; flex-shrink:0; transition: transform 0.15s; }
.tree-row.open .arrow { transform: rotate(90deg); }
.tree-row .icon { flex-shrink:0; font-size:0.85rem; }
.tree-row .label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tree-row .cnt {
  font-size: 0.62rem;
  background: var(--surface2);
  border-radius: 10px;
  padding: 1px 7px;
  color: var(--text3);
  flex-shrink: 0;
}
.tree-children { padding-left: 14px; display: none; }
.tree-children.open { display: block; }

/* ─── Main ─── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* breadcrumb */
.breadcrumb {
  padding: 10px 14px 5px;
  display: flex; align-items: center; gap: 4px;
  flex-wrap: wrap; flex-shrink: 0;
  font-size: 0.75rem;
}
.bc-part {
  cursor: pointer; color: var(--text2);
  padding: 2px 7px; border-radius: 6px;
  transition: background 0.1s, color 0.1s;
}
.bc-part:hover { background: var(--hover); color: var(--text); }
.bc-sep { color: var(--text3); font-size: 0.7rem; }
.bc-cur { color: var(--text); font-weight: 600; padding: 2px 7px; }

/* toolbar */
.toolbar {
  padding: 3px 12px 9px;
  display: flex; align-items: center; gap: 5px;
  flex-shrink: 0; flex-wrap: wrap;
}
.tb-btn {
  border-radius: var(--r-sm);
  padding: 5px 12px;
  font-size: 0.71rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  border: 1px solid;
}
.tb-green {
  background: linear-gradient(135deg, rgba(34,211,165,0.15), rgba(34,211,165,0.08));
  border-color: rgba(34,211,165,0.3);
  color: var(--green);
}
.tb-green:hover { background: linear-gradient(135deg, rgba(34,211,165,0.25), rgba(34,211,165,0.15)); border-color: var(--sel-border); }
.tb-purple {
  background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(139,92,246,0.08));
  border-color: rgba(139,92,246,0.3);
  color: #c4b5fd;
}
.tb-purple:hover { background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(139,92,246,0.15)); border-color: rgba(139,92,246,0.5); }
.tb-dim {
  background: var(--glass);
  border-color: var(--glass-border);
  color: var(--text2);
}
.tb-dim:hover { background: var(--hover); color: var(--text); }
.tb-sep { width: 1px; height: 16px; background: var(--border2); flex-shrink: 0; }

/* file list */
.file-list-wrap { flex: 1; overflow-y: auto; padding: 0 12px 110px; }

/* section label */
.section-label {
  font-size: 0.63rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text3);
  padding: 12px 4px 7px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content:''; flex:1; height:1px; background: var(--border); }

/* ─── Folder card ─── */
.folder-card {
  display: flex; align-items: center; gap: 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 5px;
  padding: 11px 13px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}
.folder-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(139,92,246,0.3), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.folder-card:hover {
  background: var(--surface2);
  border-color: rgba(139,92,246,0.25);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.folder-card:hover::before { opacity: 1; }
.folder-card.some-selected {
  border-color: var(--sel-border);
  background: rgba(34,211,165,0.05);
  box-shadow: 0 0 0 1px rgba(34,211,165,0.1);
}

.f-fold-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(59,130,246,0.15));
  border: 1px solid rgba(139,92,246,0.2);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.folder-card .f-info { flex: 1; min-width: 0; }
.folder-card .f-name {
  font-size: 0.84rem; font-weight: 500;
  color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.folder-card .f-meta { font-size: 0.69rem; color: var(--text2); margin-top: 3px; }
.f-sel-btn {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--text2);
  border-radius: var(--r-sm);
  padding: 5px 11px;
  font-size: 0.67rem;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.15s;
  white-space: nowrap;
}
.f-sel-btn:hover { border-color: var(--sel-border); color: var(--green); background: var(--green-glow); }

/* ─── File row ─── */
.file-row {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px;
  border-radius: var(--r);
  cursor: pointer;
  margin-bottom: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  position: relative;
  transition: background 0.12s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  animation: rowIn 0.3s ease both;
}
.file-row:hover {
  background: var(--surface2);
  border-color: var(--border2);
  transform: translateX(2px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}
.file-row.selected {
  background: var(--selected);
  border-color: var(--sel-border);
  box-shadow: 0 0 0 1px rgba(34,211,165,0.08), inset 3px 0 0 var(--green);
}
.file-row.selected .f-name { color: var(--green); }

@keyframes rowIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* Stagger: each row slightly delayed */
.file-row:nth-child(1)  { animation-delay: 0.00s }
.file-row:nth-child(2)  { animation-delay: 0.03s }
.file-row:nth-child(3)  { animation-delay: 0.06s }
.file-row:nth-child(4)  { animation-delay: 0.09s }
.file-row:nth-child(5)  { animation-delay: 0.12s }
.file-row:nth-child(6)  { animation-delay: 0.14s }
.file-row:nth-child(7)  { animation-delay: 0.16s }
.file-row:nth-child(8)  { animation-delay: 0.18s }
.file-row:nth-child(9)  { animation-delay: 0.20s }
.file-row:nth-child(10) { animation-delay: 0.22s }

/* Custom checkbox */
.file-row input[type=checkbox] {
  appearance: none; -webkit-appearance: none;
  width: 18px; height: 18px;
  border: 1.5px solid var(--border2);
  border-radius: 5px;
  background: var(--surface2);
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.file-row input[type=checkbox]:checked {
  background: linear-gradient(135deg, var(--green), var(--green2));
  border-color: var(--green);
  box-shadow: 0 0 8px var(--green-glow);
  transform: scale(1.1);
}
.file-row input[type=checkbox]:checked::after {
  content: '✓';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.62rem;
  color: #0d0d14;
  font-weight: 900;
}

.file-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.ic-vid  { background: linear-gradient(135deg, rgba(248,113,113,0.2), rgba(251,146,60,0.1)); }
.ic-pdf  { background: linear-gradient(135deg, rgba(251,146,60,0.2), rgba(251,191,36,0.1)); }
.ic-doc  { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(99,102,241,0.1)); }
.ic-img  { background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(244,114,182,0.1)); }
.ic-aud  { background: linear-gradient(135deg, rgba(34,211,165,0.2), rgba(52,211,153,0.1)); }
.ic-zip  { background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.08)); }
.ic-file { background: rgba(128,128,160,0.1); }

.file-row .num {
  font-size: 0.63rem; color: var(--text3);
  width: 22px; text-align: right;
  flex-shrink: 0;
}
.file-row .f-name {
  flex: 1; font-size: 0.81rem;
  color: var(--text); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
  transition: color 0.15s;
}

/* ─── State boxes ─── */
.state-box {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  padding: 70px 20px;
  color: var(--text3); text-align: center;
}
.state-box .big { font-size: 3rem; animation: float 3s ease-in-out infinite; }
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
.state-box h3 { font-size: 0.9rem; color: var(--text2); font-weight: 600; }
.state-box p { font-size: 0.8rem; line-height: 1.6; max-width: 260px; }

.spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.ring {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--purple);
  border-right-color: rgba(139,92,246,0.3);
  animation: spin 0.8s linear infinite;
  box-shadow: 0 0 12px var(--purple-glow);
}
@keyframes spin { to { transform: rotate(360deg); } }
.ring-label {
  font-size: 0.76rem; color: var(--text2);
  animation: blink 1.4s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity:0.5; } 50% { opacity:1; } }

/* ─── Toast ─── */
.toast {
  position: fixed;
  bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(14px) scale(0.9);
  padding: 10px 22px;
  border-radius: 28px;
  font-size: 0.81rem; font-weight: 600;
  z-index: 1000; pointer-events: none;
  transition: opacity 0.22s, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  opacity: 0;
  white-space: nowrap; max-width: 90vw; text-align: center;
  backdrop-filter: blur(12px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
.toast.success {
  background: linear-gradient(135deg, rgba(34,211,165,0.2), rgba(34,211,165,0.1));
  color: var(--green);
  border: 1px solid rgba(34,211,165,0.3);
  box-shadow: 0 0 20px rgba(34,211,165,0.15);
}
.toast.error {
  background: linear-gradient(135deg, rgba(248,113,113,0.2), rgba(248,113,113,0.1));
  color: var(--red);
  border: 1px solid rgba(248,113,113,0.3);
  box-shadow: 0 0 20px rgba(248,113,113,0.15);
}

/* ─── Selection bar ─── */
.sel-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  z-index: 50;
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  transform: translateY(100%);
  background: linear-gradient(180deg, rgba(13,13,20,0.0) 0%, rgba(13,13,20,0.97) 30%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border2);
  box-shadow: 0 -12px 40px rgba(0,0,0,0.5);
}
.sel-bar.visible { transform: translateY(0); }
.sel-bar.visible .send-btn { animation: btnPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes btnPop { from { transform: scale(0.8); opacity:0; } to { transform: scale(1); opacity:1; } }

.sel-info { flex: 1; }
.sel-count {
  font-size: 1.05rem; font-weight: 800;
  background: linear-gradient(90deg, var(--green), var(--blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.sel-sub { font-size: 0.7rem; color: var(--text2); margin-top: 1px; }

.send-btn {
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--green) 0%, var(--green2) 60%, #0db87a 100%);
  color: #0d0d14;
  border: none;
  border-radius: var(--r);
  padding: 12px 22px;
  font-size: 0.88rem; font-weight: 800;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.12s, box-shadow 0.2s;
  display: flex; align-items: center; gap: 7px;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(34,211,165,0.35), 0 1px 4px rgba(0,0,0,0.3);
  letter-spacing: 0.01em;
}
.send-btn:not(:disabled):hover {
  box-shadow: 0 6px 28px rgba(34,211,165,0.45), 0 1px 4px rgba(0,0,0,0.3);
  transform: translateY(-1px);
}
.send-btn:not(:disabled):active { transform: scale(0.97); opacity: 0.9; }
.send-btn:disabled {
  background: var(--surface2);
  color: var(--text3);
  box-shadow: none;
  cursor: not-allowed;
}
.send-btn.loading { opacity: 0.75; cursor: wait; }

/* ─── Mobile sidebar ─── */
@media (max-width: 600px) {
  .sidebar-toggle { display: flex; }
  .sidebar {
    position: fixed;
    top: var(--header-h); bottom: 0; left: 0;
    z-index: 30; width: 260px;
    transform: translateX(-100%);
    box-shadow: 8px 0 32px rgba(0,0,0,0.6);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 25;
    backdrop-filter: blur(3px);
  }
  .sidebar-overlay.open { display: block; }
  .main { width: 100%; }
  .file-list-wrap { padding-bottom: 120px; }
  .sel-pill { display: none !important; }
}

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--purple2), var(--blue));
  border-radius: 4px;
}
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- Header -->
<div class="header">
  <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">☰</button>

  <div class="logo-wrap">
    <div class="logo-icon">📁</div>
    <div>
      <div class="logo-name">FTM Drive</div>
    </div>
  </div>

  <div class="header-sep"></div>

  <div class="header-info">
    <div class="header-folder" id="root-title">Loading…</div>
    <div class="header-meta" id="header-count"></div>
  </div>

  <div class="sel-pill" id="sel-pill">
    <span>✓</span>
    <span id="sel-pill-n">0</span> selected
  </div>
</div>

<!-- Body -->
<div class="body">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-hdr">🗂 Folder Tree</div>
    <div class="sidebar-tree" id="sidebar-tree">
      <div class="state-box" style="padding:40px 16px">
        <div class="spinner-wrap">
          <div class="ring"></div>
          <div class="ring-label">Building tree…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="toolbar" id="toolbar" style="display:none">
      <button class="tb-btn tb-green" onclick="selectAllVisible()">☑ All Here</button>
      <button class="tb-btn tb-dim"   onclick="clearAllVisible()">✖ Clear Here</button>
      <div class="tb-sep"></div>
      <button class="tb-btn tb-purple" onclick="selectAllRecursive()">☑ Entire Folder</button>
      <button class="tb-btn tb-dim"    onclick="clearAll()">✖ Clear All</button>
    </div>

    <div class="file-list-wrap" id="file-list">
      <div class="state-box">
        <div class="spinner-wrap">
          <div class="ring"></div>
          <div class="ring-label">Loading folder contents…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Selection bar -->
<div class="sel-bar" id="sel-bar">
  <div class="sel-info">
    <div class="sel-count" id="sel-count">0</div>
    <div class="sel-sub" id="sel-sub">files selected</div>
  </div>
  <button class="send-btn" id="send-btn" onclick="sendToTelegram()" disabled>
    📲 Send to Telegram
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const uid      = {{ uid | tojson }};
const folderId = {{ folder_id | tojson }};

const tg = window.Telegram?.WebApp ?? null;
if (tg) {
  tg.ready(); tg.expand();
  tg.MainButton.setText('📲 Send to Telegram');
  tg.MainButton.onClick(sendToTelegram);
  tg.BackButton.onClick(() => {
    if (navStack.length > 1) { navStack.pop(); sidebarActivate(navStack.at(-1).id); renderMain(); }
    else tg.close();
  });
}

let rootTree = null, navStack = [], selected = new Map();

// ── Boot ──────────────────────────────────────────────────────────────────
loadTree();

async function loadTree() {
  try {
    const r = await fetch(`/api/folder_tree?uid=${encodeURIComponent(uid)}&folder_id=${encodeURIComponent(folderId)}`);
    const d = await r.json();
    if (d.error) { showError(d.message || d.error); return; }
    rootTree = d;
    document.getElementById('root-title').textContent  = rootTree.name;
    document.getElementById('header-count').textContent = `${rootTree.total_files} files`;
    renderSidebar();
    navigateTo(rootTree, true);
  } catch(e) { showError('Network error: ' + e.message); }
}

// ── Sidebar ───────────────────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('sidebar-tree');
  el.innerHTML = '';
  el.appendChild(buildTreeEl(rootTree, 0));
}

function buildTreeEl(node, depth) {
  const wrap = document.createElement('div');
  wrap.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'tree-row' + (depth === 0 ? ' active open' : '');
  row.dataset.id = node.id;

  const arr = document.createElement('span');
  arr.className = 'arrow';
  arr.textContent = node.subfolders.length ? '▶' : ' ';
  row.appendChild(arr);

  const ic = document.createElement('span');
  ic.className = 'icon'; ic.textContent = '📁';
  row.appendChild(ic);

  const lbl = document.createElement('span');
  lbl.className = 'label'; lbl.textContent = node.name;
  row.appendChild(lbl);

  if (node.total_files > 0) {
    const cnt = document.createElement('span');
    cnt.className = 'cnt'; cnt.textContent = node.total_files;
    row.appendChild(cnt);
  }
  wrap.appendChild(row);

  const ch = document.createElement('div');
  ch.className = 'tree-children' + (depth === 0 ? ' open' : '');
  node.subfolders.forEach(s => ch.appendChild(buildTreeEl(s, depth + 1)));
  wrap.appendChild(ch);

  row.addEventListener('click', () => {
    if (node.subfolders.length) { row.classList.toggle('open'); ch.classList.toggle('open'); }
    sidebarActivate(node.id);
    navigateToById(node.id);
    closeSidebar();
  });
  return wrap;
}

function sidebarActivate(id) {
  document.querySelectorAll('.tree-row').forEach(r => r.classList.remove('active'));
  document.querySelectorAll(`.tree-row[data-id="${id}"]`).forEach(r => r.classList.add('active'));
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ── Navigation ────────────────────────────────────────────────────────────
function findNodeById(id, node) {
  if (node.id === id) return node;
  for (const s of node.subfolders) { const f = findNodeById(id, s); if (f) return f; }
  return null;
}
function navigateToById(id) {
  const p = getPath(id, rootTree, []);
  if (p) { navStack = p; renderMain(); }
}
function getPath(id, node, path) {
  const np = [...path, node];
  if (node.id === id) return np;
  for (const s of node.subfolders) { const r = getPath(id, s, np); if (r) return r; }
  return null;
}
function navigateTo(node, reset) {
  if (reset) navStack = [node]; else navStack.push(node);
  sidebarActivate(node.id); renderMain();
}
function navigateBack(idx) {
  navStack = navStack.slice(0, idx + 1);
  sidebarActivate(navStack.at(-1).id); renderMain();
}
function currentNode() { return navStack.at(-1); }

// ── Render ────────────────────────────────────────────────────────────────
function renderMain() {
  renderBreadcrumb();
  renderFileList(currentNode());
  document.getElementById('toolbar').style.display = 'flex';
  if (tg) { navStack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide(); }
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  el.innerHTML = '';
  navStack.forEach((node, i) => {
    if (i > 0) { const s = document.createElement('span'); s.className='bc-sep'; s.textContent='›'; el.appendChild(s); }
    if (i === navStack.length - 1) {
      const c = document.createElement('span'); c.className='bc-cur'; c.textContent=node.name; el.appendChild(c);
    } else {
      const p = document.createElement('span'); p.className='bc-part'; p.textContent=node.name;
      p.addEventListener('click', () => navigateBack(i)); el.appendChild(p);
    }
  });
}

function iconFor(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['mp4','mkv','avi','mov','flv','wmv','webm','ts','m4v','3gp','mp4v'].includes(ext)) return ['🎬','ic-vid'];
  if (ext === 'pdf') return ['📄','ic-pdf'];
  if (['doc','docx'].includes(ext))  return ['📝','ic-doc'];
  if (['xls','xlsx'].includes(ext))  return ['📊','ic-doc'];
  if (['ppt','pptx'].includes(ext))  return ['📑','ic-doc'];
  if (['zip','rar','7z','tar','gz'].includes(ext)) return ['🗜️','ic-zip'];
  if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) return ['🖼️','ic-img'];
  if (['mp3','wav','ogg','m4a','flac','aac'].includes(ext)) return ['🎵','ic-aud'];
  return ['📄','ic-file'];
}

function renderFileList(node) {
  const wrap = document.getElementById('file-list');
  wrap.innerHTML = '';

  if (node.subfolders.length) {
    wrap.appendChild(sectionLabel(`Folders (${node.subfolders.length})`));
    node.subfolders.forEach(sub => {
      const anySelected = allFilesFromNode(sub).some(f => selected.has(f.id));
      const card = document.createElement('div');
      card.className = 'folder-card' + (anySelected ? ' some-selected' : '');
      card.dataset.id = sub.id;
      card.innerHTML = `
        <div class="f-fold-icon">📁</div>
        <div class="f-info">
          <div class="f-name">${esc(sub.name)}</div>
          <div class="f-meta">${sub.total_files} file${sub.total_files !== 1 ? 's' : ''}</div>
        </div>
        <button class="f-sel-btn">☑ All</button>`;
      card.querySelector('.f-info').addEventListener('click', () => navigateTo(sub));
      card.querySelector('.f-fold-icon').addEventListener('click', () => navigateTo(sub));
      card.querySelector('.f-sel-btn').addEventListener('click', e => {
        e.stopPropagation(); selectFolderAll(sub); card.classList.add('some-selected');
      });
      card.addEventListener('click', e => { if (!e.target.classList.contains('f-sel-btn')) navigateTo(sub); });
      wrap.appendChild(card);
    });
  }

  if (node.files.length) {
    wrap.appendChild(sectionLabel(`Files (${node.files.length})`));
    const pathStr = navStack.map(n => n.name).join('/');
    node.files.forEach((f, idx) => {
      const isSel = selected.has(f.id);
      const [icon, cls] = iconFor(f.name);
      const row = document.createElement('div');
      row.className = 'file-row' + (isSel ? ' selected' : '');
      row.dataset.id = f.id;
      row.innerHTML = `
        <input type="checkbox" ${isSel ? 'checked' : ''} data-id="${f.id}" onclick="event.stopPropagation()">
        <div class="file-icon ${cls}">${icon}</div>
        <span class="num">${idx + 1}</span>
        <span class="f-name">${esc(f.name)}</span>`;
      row.addEventListener('click', () => toggleFile(f.id, f.name, pathStr));
      row.querySelector('input').addEventListener('change', () => toggleFile(f.id, f.name, pathStr));
      wrap.appendChild(row);
    });
  }

  if (!node.subfolders.length && !node.files.length) {
    wrap.innerHTML = `<div class="state-box"><div class="big">📭</div><h3>Folder is empty</h3><p>Yeh folder mein koi file nahi hai.</p></div>`;
  }

  updateSelBar();
}

function sectionLabel(txt) {
  const d = document.createElement('div'); d.className = 'section-label'; d.textContent = txt; return d;
}

// ── Selection ─────────────────────────────────────────────────────────────
function allFilesFromNode(node, pp) {
  if (!pp) pp = navStack.map(n => n.name);
  const res = [], p = pp.join('/');
  node.files.forEach(f => res.push({id:f.id, name:f.name, path:p}));
  node.subfolders.forEach(s => res.push(...allFilesFromNode(s, [...pp, s.name])));
  return res;
}

function toggleFile(id, name, path) {
  if (selected.has(id)) selected.delete(id); else selected.set(id, {id, name, path});
  const row = document.querySelector(`.file-row[data-id="${id}"]`);
  if (row) {
    row.classList.toggle('selected', selected.has(id));
    row.querySelector('input').checked = selected.has(id);
  }
  updateSelBar();
}

function selectFolderAll(node) {
  allFilesFromNode(node, [...navStack.map(n => n.name), node.name]).forEach(f => selected.set(f.id, f));
  rerenderCbs(); updateSelBar();
}
function selectAllVisible() {
  const p = navStack.map(n => n.name).join('/');
  currentNode().files.forEach(f => selected.set(f.id, {id:f.id, name:f.name, path:p}));
  rerenderCbs(); updateSelBar();
}
function clearAllVisible() { currentNode().files.forEach(f => selected.delete(f.id)); rerenderCbs(); updateSelBar(); }
function selectAllRecursive() { allFilesFromNode(currentNode()).forEach(f => selected.set(f.id, f)); rerenderCbs(); updateSelBar(); }
function clearAll() { selected.clear(); rerenderCbs(); updateSelBar(); }

function rerenderCbs() {
  document.querySelectorAll('.file-row').forEach(row => {
    const s = selected.has(row.dataset.id);
    row.classList.toggle('selected', s);
    row.querySelector('input').checked = s;
  });
  document.querySelectorAll('.folder-card').forEach(card => {
    const sub = findNodeById(card.dataset.id, rootTree);
    if (!sub) return;
    card.classList.toggle('some-selected',
      allFilesFromNode(sub, [...navStack.map(n => n.name), sub.name]).some(f => selected.has(f.id)));
  });
}

function updateSelBar() {
  const n   = selected.size;
  const bar = document.getElementById('sel-bar');
  const btn = document.getElementById('send-btn');
  const pill = document.getElementById('sel-pill');
  const pillN = document.getElementById('sel-pill-n');

  document.getElementById('sel-count').textContent = n;
  document.getElementById('sel-sub').textContent = n === 1 ? 'file selected' : 'files selected';

  if (n > 0) {
    bar.classList.add('visible');
    if (btn) btn.disabled = false;
    if (pill) { pill.classList.add('show'); pillN.textContent = n; }
    if (tg) { try { tg.MainButton.setText(`📲 Send ${n} file${n>1?'s':''}`); tg.MainButton.show(); } catch(e){} }
  } else {
    bar.classList.remove('visible');
    if (btn) btn.disabled = true;
    if (pill) pill.classList.remove('show');
    if (tg) { try { tg.MainButton.hide(); } catch(e){} }
  }
}

// ── Tree-order traversal (matches visual display order) ───────────────────
function getAllFilesInTreeOrder() {
  const res = [];
  function traverse(node, pathParts) {
    const p = pathParts.join('/');
    node.files.forEach(f => res.push({id: f.id, name: f.name, path: p}));
    node.subfolders.forEach(s => traverse(s, [...pathParts, s.name]));
  }
  if (rootTree) traverse(rootTree, [rootTree.name]);
  return res;
}

// ── Send ──────────────────────────────────────────────────────────────────
async function sendToTelegram() {
  // Use tree traversal order (matches visual display) instead of Map insertion order
  const orderedAll = getAllFilesInTreeOrder();
  const files = orderedAll.filter(f => selected.has(f.id));
  if (!files.length) return;
  const btn = document.getElementById('send-btn');
  if (btn) { btn.disabled=true; btn.classList.add('loading'); btn.textContent='⏳ Sending…'; }
  if (tg) { try { tg.MainButton.showProgress(false); tg.MainButton.disable(); } catch(e){} }
  try {
    const r = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({uid, files}),
    });
    const d = await r.json();
    if (d.ok) {
      showToast(`✅ ${d.count} file${d.count>1?'s':''} download shuru!`, 'success');
      if (btn) btn.textContent = '✅ Sent!';
      if (tg) { try { tg.MainButton.hideProgress(); setTimeout(()=>tg.close(),1800); } catch(e){} }
      setTimeout(() => { if(btn){btn.classList.remove('loading');btn.textContent='📲 Send to Telegram';btn.disabled=!selected.size;} }, 3000);
    } else throw new Error(d.message || d.error || 'Unknown error');
  } catch(e) {
    showToast('❌ ' + e.message, 'error');
    if (btn) { btn.disabled=false; btn.classList.remove('loading'); btn.textContent='📲 Send to Telegram'; }
    if (tg) { try { tg.MainButton.hideProgress(); tg.MainButton.enable(); } catch(x){} }
  }
}

// ── Error / Toast / Utils ─────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('root-title').textContent='Error';
  document.getElementById('sidebar-tree').innerHTML='';
  document.getElementById('file-list').innerHTML=`
    <div class="state-box">
      <div class="big">⚠️</div>
      <h3>Kuch gadbad ho gayi</h3>
      <p>${esc(msg)}</p>
    </div>`;
}

let _tt = null;
function showToast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className=`toast ${type}`;
  void el.offsetWidth; el.classList.add('show');
  if (_tt) clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 3200);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
